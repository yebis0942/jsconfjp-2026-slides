<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSConf JP 2026 スライドまとめ</title>
<meta name="description" content="JSConf JP 2026（2026-11-22）の登壇資料リンク集。X（#jsconfjp）に投稿されたスライドを収集したもの。">
<style>
  :root {
    --bg: #fbfaf6;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a63;
    --border: #e4e1d6;
    --accent: #c9a400;
    --accent-ink: #1d1d1b;
    --chip: #f2efe4;
    --link: #1a5fb4;
    --track-a: #d9480f;
    --track-b: #1971c2;
    --track-c: #2f9e44;
    --track-d: #9c36b5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --surface: #1f1f1c;
      --text: #ecebe6;
      --muted: #a3a197;
      --border: #34332e;
      --accent: #f7df1e;
      --chip: #2a2925;
      --link: #74a9f2;
      --track-a: #ff8a50;
      --track-b: #5aa9ff;
      --track-c: #63d07a;
      --track-d: #d07cf0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  header { padding: 40px 0 24px; border-bottom: 1px solid var(--border); }
  .logo {
    display: inline-block; background: var(--accent); color: #1d1d1b;
    font-weight: 800; padding: 2px 10px; border-radius: 4px; font-size: 14px; letter-spacing: .04em;
  }
  h1 { margin: 12px 0 4px; font-size: clamp(24px, 5vw, 34px); line-height: 1.25; }
  .lead { margin: 0; color: var(--muted); font-size: 14px; }
  .controls {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    padding: 16px 0 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .controls input[type="search"] {
    flex: 1 1 220px; min-width: 0; padding: 8px 12px; font: inherit; font-size: 15px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .count { font-size: 13px; color: var(--muted); width: 100%; }
  .slot { margin-top: 28px; }
  .slot h2 { font-size: 15px; color: var(--muted); margin: 0 0 8px; font-variant-numeric: tabular-nums; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    border-left: 4px solid var(--track, var(--border));
  }
  .card[data-track="A"] { --track: var(--track-a); }
  .card[data-track="B"] { --track: var(--track-b); }
  .card[data-track="C"] { --track: var(--track-c); }
  .card[data-track="D"] { --track: var(--track-d); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .chip { background: var(--chip); padding: 1px 8px; border-radius: 4px; color: var(--muted); }
  .chip.track { color: var(--track); font-weight: 700; }
  .card h3 { margin: 0; font-size: 16px; line-height: 1.45; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .speaker { font-size: 13px; color: var(--muted); }
  .speaker a { color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .links a {
    font-size: 13px; padding: 4px 10px; border-radius: 6px; text-decoration: none;
    border: 1px solid var(--border); color: var(--link);
  }
  .links a.primary { background: var(--accent); color: #1d1d1b; border-color: var(--accent); font-weight: 600; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
  footer { margin: 48px 0 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>

<body>

  <div class="controls">

    <div class="count" id="count"></div>

const TRACKS = ["すべて", "A", "B", "C", "D"];
let currentTrack = "すべて";
const $ = (s) => document.querySelector(s);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function card(t) {
  const official = t.slug ? `https://jsconf.jp/2026/ja/talks/${t.slug}` : null;
  const titleHtml = official ? `<a href="${official}">${esc(t.title)}</a>` : esc(t.title);
  const meta = [
    t.track ? `<span class="chip track">トラック${t.track}</span>` : "",
    `<span class="chip">${esc(t.type)}</span>`,
    t.time ? `<span class="chip">${t.time}–${t.end}</span>` : "",
    t.lang ? `<span class="chip">${esc(t.lang)}</span>` : "",
  ].join("");
  const links = t.slides.map((s, i) =>
    `<a class="${i === 0 ? "primary" : ""}" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
  ).join("") + `<a href="https://x.com/${t.x}/status/${t.tweet}" target="_blank" rel="noopener">告知ポスト</a>`;
  return `<article class="card" data-track="${t.track || ""}">
    <div class="meta">${meta}</div>
    <h3>${titleHtml}</h3>
    <div class="speaker">${esc(t.speaker)} · <a href="https://x.com/${t.x}" target="_blank" rel="noopener">@${esc(t.x)}</a></div>
    <div class="links">${links}</div>
  </article>`;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const hits = talks.filter((t) =>
    (currentTrack === "すべて" || t.track === currentTrack) &&
    (!q || [t.title, t.speaker, t.x].join(" ").toLowerCase().includes(q))
  );
  const groups = new Map();
  for (const t of hits) {
    const key = t.time ? `${t.time}–${t.end}` : "時間未確認";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  $("#list").innerHTML = hits.length
    ? [...groups].map(([k, ts]) => `<section class="slot"><h2>${k}</h2><div class="cards">${ts.map(card).join("")}</div></section>`).join("")
    : `<p class="empty">該当するスライドはありません</p>`;
  $("#count").textContent = `${hits.length} / ${talks.length} 件`;
}

$("#filters").innerHTML = TRACKS.map((t) =>
  `<button type="button" data-t="${t}" aria-pressed="${t === currentTrack}">${t === "すべて" ? t : "トラック" + t}</button>`
).join("");
$("#filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  currentTrack = b.dataset.t;
  document.querySelectorAll("#filters button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#q").addEventListener("input", render);
render();
</script>
