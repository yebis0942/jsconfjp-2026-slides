talks.sort((a, b) => (a.time || "99:99").padStart(5, "0").localeCompare((b.time || "99:99").padStart(5, "0")) || (a.track || "Z").localeCompare(b.track || "Z"));

const TRACKS = ["すべて", "A", "B", "C", "D"];
let currentTrack = "すべて";
const $ = (s) => document.querySelector(s);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function card(t) {
  const official = t.slug ? `https://jsconf.jp/2026/ja/talks/${t.slug}` : null;
  const titleHtml = official ? `<a href="${official}">${esc(t.title)}</a>` : esc(t.title);
  const meta = [
    t.track ? `<span class="chip track">トラック${t.track}</span>` : "",
    `<span class="chip">${esc(t.type)}</span>`,
    t.time ? `<span class="chip">${t.time}–${t.end}</span>` : "",
    t.lang ? `<span class="chip">${esc(t.lang)}</span>` : "",
  ].join("");
  const none = !t.slides.length;
  const links = none ? `<span class="nodata">スライド未検出</span>` : t.slides.map((s, i) =>
    `<a class="${i === 0 ? "primary" : ""}" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
  ).join("") + `<a href="https://x.com/${t.x}/status/${t.tweet}" target="_blank" rel="noopener">告知ポスト</a>`;
  const who = t.x ? `${esc(t.speaker)} · <a href="https://x.com/${t.x}" target="_blank" rel="noopener">@${esc(t.x)}</a>` : esc(t.speaker);
  return `<article class="card${none ? " none" : ""}" data-track="${t.track || ""}">
    <div class="meta">${meta}</div>
    <h3>${titleHtml}</h3>
    <div class="speaker">${who}</div>
    <div class="links">${links}</div>
  </article>`;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const hits = talks.filter((t) =>
    (currentTrack === "すべて" || t.track === currentTrack) &&
    (!q || [t.title, t.speaker, t.x].join(" ").toLowerCase().includes(q))
  );
  const groups = new Map();
  for (const t of hits) {
    const key = t.time ? `${t.time}–${t.end}` : "時間未確認";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  $("#list").innerHTML = hits.length
    ? [...groups].map(([k, ts]) => `<section class="slot"><h2>${k}</h2><div class="cards">${ts.map(card).join("")}</div></section>`).join("")
    : `<p class="empty">該当するトークはありません</p>`;
  $("#count").textContent = `スライドあり ${hits.filter((t) => t.slides.length).length} / ${hits.length} トーク`;
}

$("#filters").innerHTML = TRACKS.map((t) =>
  `<button type="button" data-t="${t}" aria-pressed="${t === currentTrack}">${t === "すべて" ? t : "トラック" + t}</button>`
).join("");
$("#filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  currentTrack = b.dataset.t;
  document.querySelectorAll("#filters button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#q").addEventListener("input", render);
render();
</script>
